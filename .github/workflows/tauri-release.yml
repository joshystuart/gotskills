name: Tauri Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild and release (e.g. v0.0.1)
        required: true
        type: string
      dry_run:
        description: Build and package without signing or publishing
        type: boolean
        default: false

concurrency:
  group: tauri-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      skip: ${{ steps.release.outputs.skip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TAG="$REQUESTED_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(node -p "require('./app/package.json').version")
            TAG="v${VERSION}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; skipping branch-triggered build."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version format: $VERSION" >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  build-binaries:
    needs: resolve-release
    if: needs.resolve-release.outputs.skip != 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}

    steps:
      - name: Checkout release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.revision }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Set release version
        working-directory: app
        run: |
          npm pkg set version="$RELEASE_VERSION"
          sed -i '' '1,/^version = /s/^version = .*/version = "'"$RELEASE_VERSION"'"/' src-tauri/Cargo.toml
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          grep -Fx "version = \"$RELEASE_VERSION\"" src-tauri/Cargo.toml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}

      - name: Build release binary
        working-directory: app
        run: npm run build -- --target ${{ matrix.target }} --no-bundle --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: release-bin-${{ matrix.target }}
          path: app/src-tauri/target/${{ matrix.target }}/release/got-skills
          if-no-files-found: error
          retention-days: 1

  build-and-release:
    needs: [resolve-release, build-binaries]
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}

    steps:
      - name: Checkout release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.revision }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Set release version
        working-directory: app
        run: |
          npm pkg set version="$RELEASE_VERSION"
          sed -i '' '1,/^version = /s/^version = .*/version = "'"$RELEASE_VERSION"'"/' src-tauri/Cargo.toml
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          grep -Fx "version = \"$RELEASE_VERSION\"" src-tauri/Cargo.toml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-bin-*
          path: release-binaries

      - name: Assemble universal binary
        run: |
          ARM=release-binaries/release-bin-aarch64-apple-darwin/got-skills
          INTEL=release-binaries/release-bin-x86_64-apple-darwin/got-skills
          UNIVERSAL=app/src-tauri/target/universal-apple-darwin/release/got-skills
          lipo "$ARM" -verify_arch arm64
          lipo "$INTEL" -verify_arch x86_64
          mkdir -p "$(dirname "$UNIVERSAL")"
          lipo -create "$ARM" "$INTEL" -output "$UNIVERSAL"
          chmod +x "$UNIVERSAL"
          lipo "$UNIVERSAL" -verify_arch arm64 x86_64

      - name: Import Apple signing certificate
        if: inputs.dry_run != true
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/apple-signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="${{ github.run_id }}-${{ github.run_attempt }}-igotskills"
          export CERT_PATH

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          certificate = os.environ["MAC_CERTIFICATE_P12_BASE64"].strip()
          Path(os.environ["CERT_PATH"]).write_bytes(base64.b64decode(certificate))
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Apple's intermediate CAs aren't present on fresh runners, so the leaf
          # cert can't chain to a trusted root and find-identity reports 0 valid
          # identities even though the cert imported fine.
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDCA.cer" https://www.apple.com/certificateauthority/DeveloperIDCA.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security

          security import "$CERT_PATH" -f pkcs12 -k "$KEYCHAIN_PATH" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=()
          while IFS= read -r keychain; do
            EXISTING_KEYCHAINS+=("$keychain")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          CSC_NAME=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }' | sed 's/^Developer ID Application: //')
          if [ -z "$CSC_NAME" ]; then
            echo "No Developer ID Application identity found after importing certificate" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            echo "--- Certificates present in keychain (no key material shown) ---" >&2
            security find-certificate -a "$KEYCHAIN_PATH" | grep -E '"labl"|"alis"' >&2 || echo "  (no certificates found in keychain)" >&2
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=Developer ID Application: $CSC_NAME" >> "$GITHUB_ENV"

      - name: Bundle signed release files
        if: inputs.dry_run != true
        working-directory: app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri bundle --target universal-apple-darwin --bundles app,dmg,updater --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Bundle unsigned dry run
        if: inputs.dry_run == true
        working-directory: app
        run: npx tauri bundle --target universal-apple-darwin --bundles app,dmg --no-sign

      - name: Check universal app and size
        working-directory: app
        run: |
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          lipo "$BUNDLE/macos/Got Skills.app/Contents/MacOS/got-skills" -verify_arch arm64 x86_64
          scripts/check-app-size.sh "$BUNDLE/macos/Got Skills.app"

      - name: Verify release signing and notarization
        if: inputs.dry_run != true
        working-directory: app
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/Got Skills.app
          codesign --verify --deep --strict "$APP"
          xcrun stapler validate "$APP"

      - name: Upload dry-run bundles
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: universal-dry-run
          path: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 1

      - name: Collect release files and write latest.json
        if: inputs.dry_run != true
        working-directory: app
        run: |
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p release
          cp "$BUNDLE"/dmg/*.dmg "release/Got-Skills-${{ needs.resolve-release.outputs.version }}-universal.dmg"
          node scripts/updaterFeed.mjs "$BUNDLE" release "${{ needs.resolve-release.outputs.version }}" "${{ needs.resolve-release.outputs.tag }}" "${{ github.repository }}"

      - name: Create or update GitHub Release
        if: inputs.dry_run != true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          name: Got Skills ${{ needs.resolve-release.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            app/release/*.dmg
            app/release/*.tar.gz
            app/release/latest.json
