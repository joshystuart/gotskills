name: PR Tauri Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - '.github/workflows/pr-tauri.yml'
      - '.github/workflows/tauri-release.yml'
      - '.prettierrc'
      - '.prettierignore'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: pr-tauri-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prettier-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

  app-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Test
        working-directory: app
        run: npm test

      - name: Test Rust
        working-directory: app
        run: npm run test:rust

      - name: Test app size check
        working-directory: app
        run: node --test scripts/check-app-size.test.cjs

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/test-results/
          if-no-files-found: ignore

  tauri-bundle:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          shared-key: tauri-build

      - name: Build Tauri app (unsigned)
        working-directory: app
        run: npm run build

      - name: Check installed app size
        working-directory: app
        run: scripts/check-app-size.sh

  tauri-build:
    if: always()
    needs: [prettier-check, app-tests, tauri-bundle]
    runs-on: ubuntu-latest

    steps:
      - name: Require all checks to pass
        env:
          PRETTIER_RESULT: ${{ needs.prettier-check.result }}
          TEST_RESULT: ${{ needs.app-tests.result }}
          BUILD_RESULT: ${{ needs.tauri-bundle.result }}
        run: |
          test "$PRETTIER_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
