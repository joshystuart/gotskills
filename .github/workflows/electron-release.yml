name: Electron Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild and release (e.g. v0.0.1)
        required: true
        type: string

concurrency:
  group: electron-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(node -p "require('./app/package.json').version")
            TAG="v${VERSION}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; skipping branch-triggered build."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.release.outputs.skip != 'true'
        working-directory: app
        run: npm ci

      - name: Validate version format
        if: steps.release.outputs.skip != 'true'
        run: |
          if ! [[ "${{ steps.release.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "Invalid version format: ${{ steps.release.outputs.version }}"
            exit 1
          fi

      - name: Update app package version
        if: steps.release.outputs.skip != 'true'
        working-directory: app
        run: |
          npm pkg set version="${{ steps.release.outputs.version }}" || {
            echo "Failed to update package.json version"
            exit 1
          }

      - name: Verify version update
        if: steps.release.outputs.skip != 'true'
        run: |
          ACTUAL_VERSION=$(node -p "require('./app/package.json').version")
          if [ "$ACTUAL_VERSION" != "${{ steps.release.outputs.version }}" ]; then
            echo "Version mismatch: expected ${{ steps.release.outputs.version }}, got $ACTUAL_VERSION"
            exit 1
          fi

      - name: Import Apple signing certificate
        if: steps.release.outputs.skip != 'true'
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/apple-signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="${{ github.run_id }}-${{ github.run_attempt }}-igotskills"
          export CERT_PATH

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          certificate = os.environ["MAC_CERTIFICATE_P12_BASE64"].strip()
          Path(os.environ["CERT_PATH"]).write_bytes(base64.b64decode(certificate))
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Apple's intermediate CAs aren't present on fresh runners, so the leaf
          # cert can't chain to a trusted root and find-identity reports 0 valid
          # identities even though the cert imported fine.
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDCA.cer" https://www.apple.com/certificateauthority/DeveloperIDCA.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security

          security import "$CERT_PATH" -f pkcs12 -k "$KEYCHAIN_PATH" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | xargs)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          CSC_NAME=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }' | sed 's/^Developer ID Application: //')
          if [ -z "$CSC_NAME" ]; then
            echo "No Developer ID Application identity found after importing certificate" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            echo "--- Certificates present in keychain (no key material shown) ---" >&2
            security find-certificate -a "$KEYCHAIN_PATH" | grep -E '"labl"|"alis"' >&2 || echo "  (no certificates found in keychain)" >&2
            exit 1
          fi

          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CSC_NAME=$CSC_NAME" >> "$GITHUB_ENV"

      - name: Build signed release files
        if: steps.release.outputs.skip != 'true'
        working-directory: app
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:release

      - name: Create or update GitHub Release
        if: steps.release.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Got Skills ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.blockmap
            app/dist/latest-mac.yml
